[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>
#manual-link{position:fixed;top:max(5px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:10;
font:600 32px/1 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;color:#7fd3ff;background:rgba(31,33,48,.9);
border:2px solid rgba(127,211,255,.5);border-radius:999px;padding:12px 26px;text-decoration:none}
#manual-link:hover,#manual-link:focus-visible{background:rgba(42,45,66,.95);outline:2px solid #7fd3ff;outline-offset:2px}
</style>
<script>
addEventListener(\"DOMContentLoaded\", function () {
  var a = document.createElement(\"a\");
  a.id = \"manual-link\";
  a.href = \"manual/\";
  a.target = \"_blank\";
  a.rel = \"noopener\";
  a.textContent = \"Manual\";
  a.setAttribute(\"aria-label\", \"Open the user manual in a new tab\");
  document.body.appendChild(a);
});
</script>"
html/canvas_resize_policy=2
